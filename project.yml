name: DFRadar

options:
  bundleIdPrefix: com.xh
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  DFRadar:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - "Info.plist"        # 只作 INFOPLIST_FILE，不进 Copy Bundle Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xh.dfradar
        INFOPLIST_FILE: Resources/Info.plist
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
