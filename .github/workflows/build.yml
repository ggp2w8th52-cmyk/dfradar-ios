name: build

on:
  push:
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: sw_vers && xcodebuild -version && xcode-select -p

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project DFRadar.xcodeproj \
                     -scheme DFRadar \
                     -sdk iphoneos \
                     -configuration Release \
                     CODE_SIGNING_ALLOWED=NO \
                     -derivedDataPath build

      - name: Package ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/DFRadar.app Payload/
          zip -qry DFRadar.ipa Payload
          ls -lh DFRadar.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: DFRadar-ipa
          path: DFRadar.ipa